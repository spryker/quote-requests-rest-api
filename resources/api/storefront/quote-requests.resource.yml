resource:
    name: QuoteRequests
    shortName: quote-requests
    description: 'Quote request management for company users'

    provider: Spryker\Glue\QuoteRequestsRestApi\Api\Storefront\Provider\QuoteRequestsStorefrontProvider
    processor: Spryker\Glue\QuoteRequestsRestApi\Api\Storefront\Processor\QuoteRequestsStorefrontProcessor

    paginationEnabled: true

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: GetCollection
          description: 'Retrieve all quote requests for the authenticated company user'
          openapiContext:
              responses:
                  200:
                      description: 'Collection of quote requests for the authenticated company user.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'

        - type: Get
          description: 'Retrieve a specific quote request by reference'
          openapiContext:
              responses:
                  200:
                      description: 'Quote request returned.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'
                  404:
                      description: 'Quote request not found (code 4501).'

        - type: Post
          description: 'Create a new quote request'
          openapiContext:
              responses:
                  201:
                      description: 'Quote request created.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'
                  404:
                      description: 'Cart with given uuid not found (code 101) or company user not found (code 1404).'
                  422:
                      description: 'Request validation failed (cartUuid blank — code 901, cart empty — code 4503, invalid delivery date — code 4506).'

        - type: Patch
          description: 'Update an existing quote request'
          openapiContext:
              responses:
                  200:
                      description: 'Quote request updated.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'
                  404:
                      description: 'Quote request not found (code 4501) or cart not found (code 101).'
                  422:
                      description: 'Wrong status for update (code 4504), concurrent edit (code 4505) or validation failure (code 4506).'

    properties:
        quoteRequestReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Unique quote request reference'
            openapiContext:
                example: 'DE--21-123'

        status:
            type: string
            writable: false
            readable: true
            description: 'Current status of the quote request'
            openapiContext:
                example: 'draft'

        isLatestVersionVisible:
            type: boolean
            writable: false
            readable: true
            description: 'Whether the latest version is visible to the customer'
            openapiContext:
                example: true

        createdAt:
            type: string
            writable: false
            readable: true
            description: 'Creation timestamp'
            openapiContext:
                example: '2025-01-01T10:00:00+00:00'

        validUntil:
            type: string
            writable: false
            readable: true
            description: 'Expiration timestamp'
            openapiContext:
                example: '2025-02-01T23:59:59+00:00'

        versions:
            type: array
            writable: false
            readable: true
            description: 'List of version references'
            openapiContext:
                example: ['DE--21-123-1', 'DE--21-123-2']

        shownVersion:
            type: object
            objectName: QuoteRequestVersion
            writable: false
            readable: true
            description: 'Currently shown version with cart, metadata, and totals'
            properties:
                version:
                    type: integer
                    description: 'Version number.'
                    openapiContext:
                        example: 1
                versionReference:
                    type: string
                    description: 'Version reference.'
                    openapiContext:
                        example: 'DE--21-123-1'
                createdAt:
                    type: string
                    description: 'Creation timestamp of this version.'
                    openapiContext:
                        example: '2025-01-01T10:00:00+00:00'
                cart:
                    type: object
                    objectName: QuoteRequestVersionCart
                    description: 'Cart snapshot for this version.'
                    properties:
                        priceMode:
                            type: string
                            description: 'Price mode.'
                            openapiContext:
                                example: 'GROSS_MODE'
                        currency:
                            type: string
                            description: 'Currency code.'
                            openapiContext:
                                example: 'EUR'
                        store:
                            type: string
                            description: 'Store name.'
                            openapiContext:
                                example: 'DE'
                        billingAddress:
                            type: object
                            description: 'Billing address.'
                            openapiContext:
                                example: null
                        discounts:
                            type: array
                            description: 'Applied discounts.'
                            openapiContext:
                                example: []
                        shipments:
                            type: array
                            description: 'Shipments.'
                            openapiContext:
                                example: []
                        items:
                            type: array
                            description: 'Cart items.'
                            openapiContext:
                                example:
                                    - sku: '001_25904006'
                                      quantity: 2
                                      unitPrice: 3500
                                      calculations:
                                          sumGrossPrice: 7000
                        totals:
                            type: object
                            description: 'Calculated totals for the cart snapshot.'
                            properties:
                                expenseTotal:
                                    type: integer
                                    description: 'Total expenses in cents.'
                                    openapiContext:
                                        example: 590
                                discountTotal:
                                    type: integer
                                    description: 'Total discount in cents.'
                                    openapiContext:
                                        example: 0
                                taxTotal:
                                    type: object
                                    description: 'Tax total breakdown.'
                                    properties:
                                        tax_rate:
                                            type: number
                                            description: 'Effective tax rate.'
                                            openapiContext:
                                                example: 19
                                        amount:
                                            type: integer
                                            description: 'Tax amount in cents.'
                                            openapiContext:
                                                example: 1330
                                subtotal:
                                    type: integer
                                    description: 'Subtotal in cents.'
                                    openapiContext:
                                        example: 7000
                                grandTotal:
                                    type: integer
                                    description: 'Grand total in cents.'
                                    openapiContext:
                                        example: 8330
                                priceToPay:
                                    type: integer
                                    description: 'Price to pay in cents.'
                                    openapiContext:
                                        example: 8330
                metadata:
                    type: object
                    description: 'Version metadata.'
                    properties:
                        delivery_date:
                            type: string
                            description: 'Requested delivery date.'
                            openapiContext:
                                example: '2025-03-01'
                        note:
                            type: string
                            description: 'Note for the quote request.'
                            openapiContext:
                                example: 'Please deliver before noon'
                totals:
                    type: object
                    description: 'Calculated totals for this version.'
                    properties:
                        subtotal:
                            type: integer
                            description: 'Subtotal in cents.'
                            openapiContext:
                                example: 7000
                        grandTotal:
                            type: integer
                            description: 'Grand total in cents.'
                            openapiContext:
                                example: 8330

        customer:
            type: object
            objectName: Customer
            writable: false
            readable: true
            description: 'Customer and company user information'
            properties:
                firstName:
                    type: string
                    description: 'Customer first name.'
                    openapiContext:
                        example: 'Sonia'
                lastName:
                    type: string
                    description: 'Customer last name.'
                    openapiContext:
                        example: 'Wagner'
                email:
                    type: string
                    description: 'Customer email address.'
                    openapiContext:
                        example: 'sonia@acme.com'
                customerReference:
                    type: string
                    description: 'Unique customer reference.'
                    openapiContext:
                        example: 'DE--21'
                idCompanyUser:
                    type: integer
                    description: 'Company user ID.'
                    openapiContext:
                        example: 18
                idCompany:
                    type: integer
                    description: 'Company ID.'
                    openapiContext:
                        example: 9
                idCompanyBusinessUnit:
                    type: integer
                    description: 'Company business unit ID.'
                    openapiContext:
                        example: 29

        cartUuid:
            type: string
            writable: true
            readable: false
            required: false
            description: 'Cart UUID to create quote request from'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        metadata:
            type: object
            objectName: QuoteRequestMetadata
            writable: true
            readable: false
            required: false
            description: 'Metadata including delivery date and note'
            properties:
                delivery_date:
                    type: string
                    description: 'Requested delivery date.'
                    openapiContext:
                        example: '2025-03-01'
                note:
                    type: string
                    description: 'Note for the quote request.'
                    openapiContext:
                        example: 'Urgent delivery requested'

        companyUserUuid:
            type: string
            writable: false
            readable: false
            required: false
            description: 'Company user UUID feeding the `company-users` relationship — not part of the JSON:API response body.'

        companyBusinessUnitUuid:
            type: string
            writable: false
            readable: false
            required: false
            description: 'Company business unit UUID feeding the `company-business-units` relationship — not part of the JSON:API response body.'

        customerReference:
            type: string
            writable: false
            readable: false
            required: false
            description: 'Customer reference feeding the `customers` relationship — not part of the JSON:API response body.'

        concreteProductSkus:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Concrete product SKUs from the quote request items, feeding the `concrete-products` relationship (one child per SKU) — not part of the JSON:API response body.'

        idCompany:
            type: integer
            writable: false
            readable: false
            required: false
            description: 'Database identifier of the company that owns the quote request, feeding the `companies` relationship — not part of the JSON:API response body.'

    includes:
        - relationshipName: company-users
          targetResource: CompanyUsers
          resolverClass: Spryker\Glue\CompanyUsersRestApi\Api\Storefront\Relationship\CompanyUsersRelationshipResolver

        - relationshipName: companies
          targetResource: Companies
          resolverClass: Spryker\Glue\CompaniesRestApi\Api\Storefront\Relationship\CompaniesByIdCompanyRelationshipResolver

        - relationshipName: company-business-units
          targetResource: CompanyBusinessUnits
          uriVariableMappings:
              companyBusinessUnitUuid: uuid

        - relationshipName: customers
          targetResource: Customers
          uriVariableMappings:
              customerReference: customerReference

        - relationshipName: concrete-products
          targetResource: ConcreteProducts
          uriTemplate: /concrete-products/{sku}
          uriVariableMappings:
              concreteProductSkus: sku
