resource:
    name: QuoteRequestSendToUser
    shortName: quote-request-send-to-user
    description: 'Send a quote request to user for review'

    processor: Spryker\Glue\QuoteRequestsRestApi\Api\Storefront\Processor\QuoteRequestSendToUserStorefrontProcessor

    paginationEnabled: false

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Post
          description: 'Send a quote request to user'
          uriTemplate: '/quote-requests/{quoteRequestReference}/quote-request-send-to-user'
          uriVariables:
              quoteRequestReference:
                  toProperty: 'quoteRequest'
                  fromClass: QuoteRequestsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Quote request sent to the company user.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'
                  422:
                      description: 'Quote request status does not allow sending (code 4504), or the reference does not resolve to a quote request of the authenticated company user (code 4506).'

    properties:
        quoteRequestReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Reference of the sent quote request'
            openapiContext:
                example: 'DE--21-123'

        status:
            type: string
            writable: false
            readable: true
            description: 'Status after sending'
            openapiContext:
                example: 'waiting'

        shownVersion:
            type: object
            objectName: QuoteRequestVersion
            writable: false
            readable: true
            description: 'Currently shown version with cart, metadata, and totals'
            properties:
                version:
                    type: integer
                    description: 'Version number.'
                    openapiContext:
                        example: 1
                versionReference:
                    type: string
                    description: 'Version reference.'
                    openapiContext:
                        example: 'DE--21-123-1'
                cart:
                    type: object
                    objectName: QuoteRequestVersionCart
                    description: 'Cart snapshot for this version.'
                    properties:
                        priceMode:
                            type: string
                            description: 'Price mode.'
                            openapiContext:
                                example: 'GROSS_MODE'
                        currency:
                            type: string
                            description: 'Currency code.'
                            openapiContext:
                                example: 'EUR'
                        store:
                            type: string
                            description: 'Store name.'
                            openapiContext:
                                example: 'DE'
                        billingAddress:
                            type: object
                            description: 'Billing address.'
                            openapiContext:
                                example: null
                        discounts:
                            type: array
                            description: 'Applied discounts.'
                            openapiContext:
                                example: []
                        shipments:
                            type: array
                            description: 'Shipments.'
                            openapiContext:
                                example: []
                        items:
                            type: array
                            description: 'Cart items.'
                            openapiContext:
                                example:
                                    - sku: '001_25904006'
                                      quantity: 2
                                      unitPrice: 3500
                                      calculations:
                                          sumGrossPrice: 7000
                        totals:
                            type: object
                            description: 'Calculated totals for the cart snapshot.'
                            properties:
                                expenseTotal:
                                    type: integer
                                    description: 'Total expenses in cents.'
                                    openapiContext:
                                        example: 590
                                discountTotal:
                                    type: integer
                                    description: 'Total discount in cents.'
                                    openapiContext:
                                        example: 0
                                taxTotal:
                                    type: object
                                    description: 'Tax total breakdown.'
                                    properties:
                                        tax_rate:
                                            type: number
                                            description: 'Effective tax rate.'
                                            openapiContext:
                                                example: 19
                                        amount:
                                            type: integer
                                            description: 'Tax amount in cents.'
                                            openapiContext:
                                                example: 1330
                                subtotal:
                                    type: integer
                                    description: 'Subtotal in cents.'
                                    openapiContext:
                                        example: 7000
                                grandTotal:
                                    type: integer
                                    description: 'Grand total in cents.'
                                    openapiContext:
                                        example: 8330
                                priceToPay:
                                    type: integer
                                    description: 'Price to pay in cents.'
                                    openapiContext:
                                        example: 8330
                metadata:
                    type: object
                    description: 'Version metadata.'
                    properties:
                        delivery_date:
                            type: string
                            description: 'Requested delivery date.'
                            openapiContext:
                                example: '2025-03-01'
                        note:
                            type: string
                            description: 'Note for the quote request.'
                            openapiContext:
                                example: 'Please deliver before noon'
                totals:
                    type: object
                    description: 'Calculated totals for this version.'
                    properties:
                        subtotal:
                            type: integer
                            description: 'Subtotal in cents.'
                            openapiContext:
                                example: 7000
                        grandTotal:
                            type: integer
                            description: 'Grand total in cents.'
                            openapiContext:
                                example: 8330

        quoteRequest:
            type: QuoteRequestsStorefrontResource
            writable: false
            readable: false
            required: false
            description: 'The parent quote request'
