resource:
    name: QuoteRequestSendToUser
    shortName: quote-request-send-to-user
    description: 'Send a quote request to user for review'

    processor: Spryker\Glue\QuoteRequestsRestApi\Api\Storefront\Processor\QuoteRequestSendToUserStorefrontProcessor

    paginationEnabled: false

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Post
          description: 'Send a quote request to user'
          uriTemplate: '/quote-requests/{quoteRequestReference}/quote-request-send-to-user'
          uriVariables:
              quoteRequestReference:
                  toProperty: 'quoteRequest'
                  fromClass: QuoteRequestsStorefrontResource
          openapiContext:
              responses:
                  200:
                      description: 'Quote request sent to the company user.'
                  401:
                      description: 'Missing or invalid access token.'
                  403:
                      description: 'Authenticated customer is not a company user.'
                  404:
                      description: 'Quote request not found (code 4501).'
                  422:
                      description: 'Quote request status does not allow sending (code 4504).'

    properties:
        quoteRequestReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Reference of the sent quote request'
            openapiContext:
                example: 'DE--21-123'

        status:
            type: string
            writable: false
            readable: true
            description: 'Status after sending'
            openapiContext:
                example: 'waiting'

        shownVersion:
            type: array
            writable: false
            readable: true
            description: 'Currently shown version with cart, metadata, and totals'
            openapiContext:
                example:
                    version: 1
                    versionReference: 'DE--21-123-1'
                    cart:
                        priceMode: 'GROSS_MODE'
                        currency: 'EUR'
                        store: 'DE'
                        items:
                            - sku: '001_25904006'
                              quantity: 2
                              unitPrice: 3500
                              calculations:
                                  sumGrossPrice: 7000
                        billingAddress: null
                        discounts: []
                        shipments: []
                    metadata:
                        delivery_date: '2025-03-01'
                        note: 'Please deliver before noon'
                    totals:
                        subtotal: 7000
                        grandTotal: 8330

        quoteRequest:
            type: QuoteRequestsStorefrontResource
            writable: false
            readable: false
            required: false
            description: 'The parent quote request'
